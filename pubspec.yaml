name: chess_pgn_reader
description: PGN okuyucu, bulmaca kütüphanesi ve cihazda çalışan satranç motoru.
publish_to: 'none'
version: 9.0.6+24

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  just_audio: ^0.9.46
  file_picker: ^10.0.0
  just_audio_windows: ^0.2.3
  flutter_svg: ^2.3.0
  wakelock_plus: ^1.5.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/boards/
    - assets/icon/
    - assets/pieces/chessnut/
    - assets/pieces/rhosgfx/
    - assets/pieces/fantasy/
    - assets/pieces/spatial/
    - assets/pieces/celtic/
    - assets/pieces/kiwen-suwi/
    - assets/pieces/firi/
    - assets/pieces/totoy/
    - assets/pieces/papercut/
    - assets/pieces/cburnett/
    - assets/pieces/merida/
    - assets/pieces/mono/
    - assets/pieces/letter/
    - assets/pieces/pirouetti/
    - assets/pieces/pixel/
    - assets/pieces/mpchess/

  # Ana menüdeki at (♞) sistem yazı tipinden geliyordu: Android'de Noto,
  # Windows'ta Segoe çiziyordu ve ikisi birbirini tutmuyordu. Uygulama
  # simgesi de o çizimden üretildiği için üçü ayrı görünüyordu. Artık
  # Android'in kullandığı yazı tipi uygulamayla birlikte geliyor.
  fonts:
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: 'assets/icon/icon.png'
    icon_size: 256
  image_path: 'assets/icon/icon.png'
  adaptive_icon_background: '#6C953C'
  adaptive_icon_foreground: 'assets/icon/icon.png'
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 23
