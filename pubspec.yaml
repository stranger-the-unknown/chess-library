name: chess_pgn_reader
description: PGN okuyucu, bulmaca kütüphanesi ve cihazda çalışan satranç motoru.
publish_to: 'none'
version: 3.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  just_audio: ^0.9.46
  file_picker: ^10.0.0
  just_audio_windows: ^0.2.3
  flutter_svg: ^2.3.0
  stockfish_chess_engine: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/boards/
    - assets/icon/
    - assets/pieces/chessnut/
    - assets/pieces/rhosgfx/
    - assets/pieces/fantasy/
    - assets/pieces/spatial/
    - assets/pieces/celtic/
    - assets/pieces/kiwen-suwi/
    - assets/pieces/firi/
    - assets/pieces/totoy/
    - assets/pieces/papercut/
    - assets/pieces/cburnett/
    - assets/pieces/merida/
    - assets/pieces/mono/
    - assets/pieces/letter/
    - assets/pieces/pirouetti/
    - assets/pieces/pixel/
    - assets/pieces/mpchess/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/icon.png'
  adaptive_icon_background: '#3D6122'
  adaptive_icon_foreground: 'assets/icon/icon_foreground.png'
  remove_alpha_ios: true
  min_sdk_android: 23
